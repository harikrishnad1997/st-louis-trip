<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>St. Louis Weekend — Trip Map (color-coded by day)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #bar { background: #7a3b12; color: #fff; padding: 10px 14px; }
  #bar h1 { font-size: 18px; margin: 0 0 2px; }
  #bar p { margin: 0; font-size: 13px; opacity: .9; }
  #map { height: calc(100% - 62px); }
  .pin { border-radius: 50%; color: #fff; font-weight: 700; font-size: 12px; text-align: center; line-height: 24px; width: 24px; height: 24px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .legend { background: rgba(255,255,255,.92); padding: 6px 8px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.3); font-size: 12px; line-height: 1.55; }
  @media (max-width: 700px) { .legend { display: none; } }
  .legend .chip { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .leaflet-popup-content { font-size: 14px; }
</style>
</head>
<body>
<div id="bar">
  <h1>St. Louis Weekend — Trip Map</h1>
  <p>Every stop, color-coded by day. Use the layer filter (top right) to show one day at a time. Tap a pin for the stop name and a Google Maps link.</p>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var COLORS = { day1: "#1d6fb8", day2: "#e07b00", day3: "#1e8e3e" };
var DAYLABEL = { day1: "Day 1 · Fri Nov 6", day2: "Day 2 · Sat Nov 7", day3: "Day 3 · Sun Nov 8" };
var STOPS = [
  // Day 1
  { n: "1 · Lunch — A2B Indian Veg Restaurant, Warrenville", d: "day1", t: "~12:30–1:30 PM · 28244 Diehl Rd · pure-veg South Indian · Fri lunch 11:30 AM–3:30 PM · out by 1:30", lat: 41.80375, lng: -88.16820, q: "A2B+Indian+Veg+Restaurant+28244+Diehl+Rd+Warrenville+IL" },
  { n: "2 · Lincoln Home National Historic Site — Springfield (SPRINT: stamp only)", d: "day1", t: "~4:30–4:45 PM · Visitor Center closes 5 PM · stamp + Eastern National store only — house tour moves to Sunday · skip if past 4:45", lat: 39.79724, lng: -89.64496, q: "Lincoln+Home+National+Historic+Site+Springfield+IL" },
  { n: "3 · St. Louis Union Station", d: "day1", t: "~7:00 PM · Grand Hall light show hourly 5–10 PM · Wheel 10 AM–10 PM · dinner on site", lat: 38.62709, lng: -90.20907, q: "St+Louis+Union+Station+1820+Market+St" },
  { n: "4 · The St. Louis Wheel (at Union Station)", d: "day1", t: "Fri evening or Sat sunset · 10 AM–10 PM · from ~$19", lat: 38.62775, lng: -90.20959, q: "The+St+Louis+Wheel" },
  { n: "5 · St. Louis Aquarium at Union Station (Sat swap option — closes 7 PM, too late Fri)", d: "day1", t: "9 AM–7 PM daily · ~$25–30 adults", lat: 38.62780, lng: -90.20754, q: "St+Louis+Aquarium+at+Union+Station" },
  // Day 2
  { n: "1 · Ulysses S. Grant National Historic Site (stamp + JNPA store)", d: "day2", t: "9:00 AM · free · 9 AM–5 PM · 7400 Grant Rd", lat: 38.55026, lng: -90.35191, q: "Ulysses+S+Grant+National+Historic+Site+St+Louis" },
  { n: "2 · Old Courthouse (Dred Scott site + JNPA shop)", d: "day2", t: "~11:00 AM · free · 9 AM–5 PM", lat: 38.62569, lng: -90.18923, q: "Old+Courthouse+11+N+4th+St+St+Louis" },
  { n: "3 · Gateway Arch National Park (stamp + The Arch Store)", d: "day2", t: "~1:00 PM · afternoon tram ticket in advance · Visitor Center 9 AM–6 PM", lat: 38.62485, lng: -90.18597, q: "Gateway+Arch+National+Park+St+Louis" },
  { n: "4 · City Museum", d: "day2", t: "Evening · open late Sat · 750 N 16th St", lat: 38.63357, lng: -90.20076, q: "City+Museum+750+N+16th+St+St+Louis" },
  // Day 3 (late breakfast, noon departure; assumes the 9:00 PM Lombard return)
  { n: "1 · Late breakfast + noon departure — St. Louis", d: "day3", t: "Sun ~10:30 AM late breakfast · pack + check out before · leave 12:00 PM · Lombard ~5:00–5:30 PM (after-hours drop)", lat: 38.62709, lng: -90.20907, q: "St+Louis+Union+Station" },
  { n: "2 · Lincoln Home — the house-tour slot (Springfield)", d: "day3", t: "Pass Springfield ~1:35 PM · VC open Sun til 5 PM · Friday was a stamp sprint after the A2B lunch, so the house tour happens here · leave by 2:30 PM → Lombard ~5:45–6:00 PM", lat: 39.79724, lng: -89.64496, q: "Lincoln+Home+National+Historic+Site+Springfield+IL" }
];
var map = L.map("map");
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
var layers = {};
Object.keys(DAYLABEL).forEach(function (k) { layers[k] = L.layerGroup().addTo(map); });
var bounds = [];
STOPS.forEach(function (s) {
  var num = s.n.split(" ")[0];
  var icon = L.divIcon({ className: "", html: '<div class="pin" style="background:' + COLORS[s.d] + '">' + num + '</div>', iconSize: [24, 24], iconAnchor: [12, 12] });
  var html = "<b>" + s.n + "</b><br>" + s.t + '<br><a href="https://www.google.com/maps/search/?api=1&query=' + s.q + '" target="_blank" rel="noopener">Open in Google Maps</a>';
  L.marker([s.lat, s.lng], { icon: icon }).bindPopup(html).addTo(layers[s.d]);
  bounds.push([s.lat, s.lng]);
});
var overlays = {};
Object.keys(DAYLABEL).forEach(function (k) { overlays[DAYLABEL[k]] = layers[k]; });
L.control.layers(null, overlays, { collapsed: window.innerWidth < 700 }).addTo(map);
var legend = L.control({ position: "bottomleft" });
legend.onAdd = function () {
  var div = L.DomUtil.create("div", "legend");
  div.innerHTML = Object.keys(DAYLABEL).map(function (k) { return '<span class="chip" style="background:' + COLORS[k] + '"></span>' + DAYLABEL[k]; }).join("<br>");
  return div;
};
legend.addTo(map);
map.fitBounds(bounds, { padding: [30, 30] });
</script>
</body>
</html>
